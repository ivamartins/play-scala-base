# https://www.playframework.com/documentation/latest/Configuration

# DB for legacy modernization demos (H2 in-memory base; swap to Postgres in prod)
db.default.driver=org.h2.Driver
db.default.url="jdbc:h2:mem:play"
db.default.username=sa
db.default.password=""

# Enable evolutions for schema (migrations from legacy)
play.evolutions.enabled=true
play.evolutions.autoApply=true

# Example: legacy-like settings
legacy.system.name="OldPlayEcommerce"
